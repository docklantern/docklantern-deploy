name: Validate Docker Compose deployment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4
      - name: Prepare safe local test inputs
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p secrets
          printf '%s\n' 'temporary-ci-password-not-a-real-secret-12345' > secrets/admin_password.txt
      - name: Verify Docker Compose is available
        run: docker compose version
      - name: Validate base and discovery overlay
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.discovery.yaml config -q
          docker compose -f compose.yaml -f compose.discovery.yaml -f compose.projects.example.yaml config -q
          docker compose -f compose.yaml -f compose.discovery.yaml -f compose.receipts.yaml config -q
          docker compose -f compose.yaml -f compose.discovery.yaml -f compose.projects.example.yaml -f compose.receipts.yaml config -q
          docker compose -f examples/hello-js-monitor.yaml config -q
      - name: Check exposed ports and security invariants
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.discovery.yaml -f compose.projects.example.yaml config --format json > /tmp/docklantern-compose.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          c = json.loads(Path('/tmp/docklantern-compose.json').read_text())
          services = c['services']
          assert set(services) == {'docklantern', 'docker-socket-proxy'}
          assert not services['docklantern'].get('ports'), 'DockLantern must not publish port 8787'
          assert not services['docker-socket-proxy'].get('ports'), 'Docker proxy must not publish port 2375'
          assert services['docklantern']['read_only'] is True
          assert 'ALL' in services['docklantern']['cap_drop']
          # Deployment must use an immutable Docker Hub release index, not
          # a mutable :latest or unpinned version tag.
          assert re.fullmatch(
              r'davidslusser/docklantern:v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?@sha256:[0-9a-f]{64}',
              services['docklantern']['image']
          ), 'DockLantern app image must be versioned and pinned to an immutable sha256 digest'
          assert services['docker-socket-proxy']['environment']['POST'] == '0'
          assert c['networks']['docker-discovery']['internal'] is True
          assert c['networks']['web']['external'] is True
          assert c['networks']['docklantern-ipv6-egress']['external'] is True
          assert services['docklantern']['environment']['DOCKLANTERN_ADMIN_PASSWORD_FILE'] == '/run/secrets/admin_password'
          assert services['docklantern']['labels']['traefik.http.middlewares.docklantern-security.headers.referrerPolicy'] == 'same-origin'
          mounts = services['docklantern']['volumes']
          for directory in ('/srv/apps/hello-py', '/srv/apps/hello-js'):
            assert any(m['source'] == directory and m['target'] == directory and m.get('read_only') for m in mounts), f'missing read-only source mount: {directory}'
          command = services['docklantern']['command']
          assert '-roots' in command and command[command.index('-roots') + 1] == '/srv/apps/hello-py,/srv/apps/hello-js'
          # Unlike legacy registration, label-only monitoring requires no
          # per-project mounts or -roots changes in DockLantern.
          base = json.loads(__import__('subprocess').check_output([
              'docker','compose','-f','compose.yaml','-f','compose.discovery.yaml',
              'config','--format','json'], text=True))
          app = base['services']['docklantern']
          assert '-roots' not in app['command']
          assert not any('/srv/apps/' in str(v) for v in app.get('volumes', []))
          label_fixture = json.loads(__import__('subprocess').check_output([
              'docker','compose','-f','examples/hello-js-monitor.yaml',
              'config','--format','json'], text=True))
          assert label_fixture['services']['web']['labels']['com.docklantern.monitor'] == 'true'
          assert label_fixture['services']['web']['labels']['com.docklantern.interval'] == '10m'
          receipts = json.loads(__import__('subprocess').check_output([
              'docker','compose','-f','compose.yaml','-f','compose.discovery.yaml',
              '-f','compose.receipts.yaml','config','--format','json'], text=True))
          assert set(receipts['services']) == {'docklantern', 'docker-socket-proxy'}
          assert receipts['services']['docker-socket-proxy']['environment']['POST'] == '0'
          assert not receipts['services']['docklantern'].get('ports')
          assert not receipts['services']['docker-socket-proxy'].get('ports')
          mounts = receipts['services']['docklantern']['volumes']
          expected = [m for m in mounts
                      if m.get('target') == '/run/docklantern/executor-receipts']
          assert len(expected) == 1, 'expected one sanitized receipt mount'
          receipt_mount = expected[0]
          assert receipt_mount['type'] == 'bind'
          assert receipt_mount['source'] == '/var/lib/docklantern/handoff/receipts'
          assert receipt_mount['read_only'] is True
          assert receipt_mount.get('bind', {}).get('create_host_path') is False
          assert len(mounts) == len(app['volumes']) + 1, 'unexpected additional host mounts'
          for forbidden in ('/var/run/docker.sock', '/var/lib/docklantern/executor',
                            '/var/lib/docklantern/executor/registrations',
                            '/var/lib/docklantern/executor/journal'):
              assert all(m.get('source') != forbidden for m in mounts), forbidden
          print('Compose validation and security checks passed')
          PY
