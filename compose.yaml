# DockLantern beta: monitoring-only web dashboard behind an existing Traefik.
# Combine with compose.discovery.yaml for Docker inventory.
name: docklantern

services:
  docklantern:
    image: davidslusser/docklantern:v0.1.0-beta.2
    restart: unless-stopped
    init: true
    command: ["-mode", "serve", "-db", "/data/docklantern.db", "-listen", "0.0.0.0:8787", "-run-monitor"]
    environment:
      DOCKLANTERN_ADMIN_USERNAME: ${DOCKLANTERN_ADMIN_USERNAME:?set admin username}
      DOCKLANTERN_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DOCKLANTERN_ALLOW_PROXY: "1"
      DOCKLANTERN_PUBLIC_ORIGIN: https://${DOCKLANTERN_DOMAIN:?set dashboard domain}
    secrets:
      - admin_password
    volumes:
      - docklantern_data:/data
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.docklantern.rule=Host(`${DOCKLANTERN_DOMAIN:?set dashboard domain}`)
      - traefik.http.routers.docklantern.entrypoints=websecure
      - traefik.http.routers.docklantern.tls=true
      # Do NOT set tls.certresolver=letsencrypt unless that resolver really exists.
      # This deployment relies on the existing Traefik TLS configuration.
      - traefik.http.routers.docklantern.service=docklantern
      - traefik.http.services.docklantern.loadbalancer.server.port=8787
      - traefik.http.routers.docklantern.middlewares=docklantern-rate-limit,docklantern-security
      - traefik.http.middlewares.docklantern-rate-limit.ratelimit.average=2
      - traefik.http.middlewares.docklantern-rate-limit.ratelimit.burst=10
      - traefik.http.middlewares.docklantern-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.docklantern-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.docklantern-security.headers.referrerPolicy=same-origin
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  docklantern_data:

secrets:
  admin_password:
    file: ./secrets/admin_password.txt

networks:
  web:
    external: true
